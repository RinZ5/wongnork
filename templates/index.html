<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork — Recipe Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --orange: #f59e0b;
            --orange-dark: #d97706;
            --orange-light: #fef3c7;
            --text: #1a1a1a;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bg: #fafaf9;
            --white: #ffffff;
            --header-h: 64px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            height: var(--header-h);
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
            text-decoration: none;
        }

        .brand-bubble {
            width: 38px;
            height: 38px;
            background: var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .brand-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .brand-cooking {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 1rem;
            border-left: 1px solid var(--border);
            margin-left: 0.25rem;
        }

        .cooking-icon {
            font-size: 1.2rem;
        }

        .cooking-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .header-search {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .header-search input {
            width: 100%;
            padding: 0.55rem 3rem 0.55rem 1.1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.2s;
        }

        .header-search input:focus {
            border-color: var(--orange);
        }

        .header-search input::placeholder {
            color: var(--text-muted);
        }

        .header-search button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: var(--orange);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .header-search button:hover {
            background: var(--orange-dark);
        }

        .header-search button svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .hero {
            text-align: center;
            padding: 5rem 1rem;
            display: block;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }

        .hero h1 span {
            color: var(--orange);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2rem;
        }

        .hero-search {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
        }

        .hero-search input {
            width: 100%;
            padding: 1rem 1.3rem;
            padding-right: 130px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .hero-search input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
        }

        .hero-search button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.65rem 1.5rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .hero-search button:hover {
            background: var(--orange-dark);
        }

        .alert {
            background: var(--orange-light);
            border-left: 3px solid var(--orange);
            padding: 0.75rem 1.2rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #92400e;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert a {
            font-weight: 600;
            color: var(--orange-dark);
            text-decoration: underline;
            cursor: pointer;
        }

        #resultsSection {
            display: none;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .results-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .results-title span {
            color: var(--orange);
        }

        .results-count {
            font-size: 0.88rem;
            color: var(--text-muted);
            background: var(--border);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .recipe-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .recipe-item {
            display: flex;
            gap: 1.2rem;
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 4px;
        }

        .recipe-item:hover {
            background: #fff8f0;
            padding-left: 0.6rem;
            padding-right: 0.6rem;
        }

        .recipe-thumb {
            width: 160px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--border);
        }

        .recipe-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.4rem;
        }

        .recipe-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .recipe-ingredients {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .recipe-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .badge-score {
            font-size: 0.78rem;
            font-weight: 600;
            background: var(--orange-light);
            color: #92400e;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .badge-ingredients {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            display: none;
        }

        .no-results h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        .modal-box {
            background: var(--white);
            width: 100%;
            max-width: 820px;
            max-height: 90vh;
            border-radius: 20px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-hero-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            border-radius: 20px 20px 0 0;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            font-size: 1.3rem;
            line-height: 36px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-body {
            padding: 1.75rem 2rem 2rem;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .modal-cols {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 640px) {
            .modal-cols {
                grid-template-columns: 1fr;
            }

            .recipe-thumb {
                width: 100px;
                height: 80px;
            }

            .recipe-name {
                font-size: 1rem;
            }

            .hero h1 {
                font-size: 2.2rem;
            }
        }

        .col-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: var(--orange-dark);
            margin-bottom: 0.85rem;
        }

        .modal-cols ul,
        .modal-cols ol {
            padding-left: 1.1rem;
            color: #374151;
            font-size: 0.93rem;
            line-height: 1.6;
        }

        .modal-cols li {
            margin-bottom: 0.45rem;
        }

        .spinner {
            display: none;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .spinner-ring {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recipe-item {
            animation: fadeUp 0.3s ease both;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="#" onclick="showHero()">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>

            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>

            <form id="headerSearchForm" class="header-search" onsubmit="return false;" style="display:none;">
                <input id="headerSearchInput" type="text" placeholder="Search recipes, ingredients...">
                <button type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </button>
            </form>
        </div>
    </header>

    <main>
        <div id="heroSection" class="hero">
            <h1>Find your next<br><span>favourite recipe</span></h1>
            <p>Search thousands of recipes by name, ingredient, or cuisine</p>
            <form id="heroSearchForm" class="hero-search" onsubmit="return false;">
                <input id="heroSearchInput" type="text" placeholder="e.g. chicken, pasta, vegan stir-fry...">
                <button type="submit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    Search
                </button>
            </form>
        </div>

        <div id="resultsSection">
            <div id="typoAlert" class="alert">
                Did you mean: <a id="suggestedLink"></a>?
            </div>

            <div class="results-header">
                <h2 class="results-title">Recipes for <span id="queryLabel"></span></h2>
                <span id="resultsCount" class="results-count"></span>
            </div>

            <div id="spinner" class="spinner"><span class="spinner-ring"></span></div>

            <div id="noResults" class="no-results">
                <h3>No recipes found</h3>
                <p>Try simpler keywords or different ingredients</p>
            </div>

            <div id="recipeList" class="recipe-list"></div>
        </div>

    </main>

    <div id="recipeModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="modalImg" class="modal-hero-img" src="" alt="">
            <div class="modal-body">
                <h2 id="modalTitle" class="modal-title"></h2>
                <div class="modal-cols">
                    <div>
                        <div class="col-label">Ingredients</div>
                        <ul id="modalIngredients"></ul>
                    </div>
                    <div>
                        <div class="col-label">Instructions</div>
                        <ol id="modalInstructions"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const parseArray = (str) => {
            if (!str || str === 'character(0)') return [];
            try {
                let cleaned = str.replace(/^c\(/, '').replace(/\)$/, '');
                let matches = [...cleaned.matchAll(/"([^"]+)"|'([^']+)'/g)];
                return matches.map(m => m[1] || m[2]);
            } catch (e) { return [str]; }
        };

        const getImage = (str) => {
            const arr = parseArray(str);
            if (arr.length && arr[0].startsWith('http')) return arr[0];
            return 'https://via.placeholder.com/400x300/f3f4f6/9ca3af?text=No+Image';
        };

        async function executeSearch(query) {
            if (!query.trim()) return;

            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('headerSearchForm').style.display = 'flex';
            document.getElementById('headerSearchInput').value = query;
            document.getElementById('queryLabel').textContent = `"${query}"`;
            document.getElementById('recipeList').innerHTML = '';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('typoAlert').style.display = 'none';
            document.getElementById('spinner').style.display = 'block';

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                document.getElementById('spinner').style.display = 'none';

                if (data.has_typo) {
                    const alert = document.getElementById('typoAlert');
                    const link = document.getElementById('suggestedLink');
                    link.textContent = data.suggested_query;
                    link.onclick = (e) => { e.preventDefault(); executeSearch(data.suggested_query); };
                    alert.style.display = 'block';
                }

                const list = document.getElementById('recipeList');

                if (!data.results || data.results.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    document.getElementById('resultsCount').textContent = '0 results';
                    return;
                }

                document.getElementById('resultsCount').textContent = `${data.results.length} result${data.results.length !== 1 ? 's' : ''}`;

                data.results.forEach((recipe, i) => {
                    const ings = parseArray(recipe.RecipeIngredientParts);
                    const ingPreview = ings.slice(0, 5).join(', ') + (ings.length > 5 ? '…' : '');

                    const item = document.createElement('div');
                    item.className = 'recipe-item';
                    item.style.animationDelay = `${i * 40}ms`;
                    item.onclick = () => openModal(recipe);
                    item.innerHTML = `
                        <img class="recipe-thumb" src="${getImage(recipe.Images)}" loading="lazy" alt="${recipe.Name}">
                        <div class="recipe-info">
                            <div class="recipe-name">${recipe.Name}</div>
                            <div class="recipe-ingredients"><strong>Ingredients:</strong> ${ingPreview || '—'}</div>
                            <div class="recipe-meta">
                                <span class="badge-score">⭐ ${recipe.Score.toFixed(2)}</span>
                                ${ings.length ? `<span class="badge-ingredients">${ings.length} ingredients</span>` : ''}
                            </div>
                        </div>
                    `;
                    list.appendChild(item);
                });

            } catch (err) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                console.error(err);
            }
        }

        function openModal(recipe) {
            document.getElementById('modalTitle').textContent = recipe.Name;
            document.getElementById('modalImg').src = getImage(recipe.Images);
            document.getElementById('modalIngredients').innerHTML =
                parseArray(recipe.RecipeIngredientParts).map(i => `<li>${i}</li>`).join('') || '<li>—</li>';
            document.getElementById('modalInstructions').innerHTML =
                parseArray(recipe.RecipeInstructions).map(s => `<li>${s}</li>`).join('') || '<li>—</li>';
            document.getElementById('recipeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('recipeModal').style.display = 'none';
        }

        function showHero() {
            document.getElementById('heroSection').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('headerSearchForm').style.display = 'none';
        }

        document.getElementById('heroSearchForm').addEventListener('submit', e => {
            e.preventDefault();
            executeSearch(document.getElementById('heroSearchInput').value);
        });

        document.getElementById('headerSearchForm').addEventListener('submit', e => {
            e.preventDefault();
            executeSearch(document.getElementById('headerSearchInput').value);
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
