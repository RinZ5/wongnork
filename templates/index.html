<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork — Recipe Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folders.css') }}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="/">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>

            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>

            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main>
        <div id="heroSection" class="hero">
            <h1>Find your next<br><span>favourite recipe</span></h1>
            <p>Search thousands of recipes by name, ingredient, or cuisine</p>
            <form id="heroSearchForm" class="hero-search" action="/search" method="get">
                <input id="heroSearchInput" name="q" type="text" placeholder="e.g. chicken, pasta, vegan stir-fry...">
                <button type="submit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    Search
                </button>
            </form>
        </div>

    </main>

    <div id="createFolderModal" class="modal-overlay">
        <div class="modal-box modal-small">
            <button class="modal-close" onclick="closeCreateFolderModal()">✕</button>
            <h2 class="modal-title">Create New Folder</h2>
            <form id="createFolderForm" class="auth-form">
                <div class="form-group">
                    <label for="folderName">Folder Name</label>
                    <input type="text" id="folderName" name="folderName" placeholder="e.g. Favorites, Dinner Ideas" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Create Folder</span>
                    <span class="btn-spinner" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.3" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round">
                                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite" />
                            </path>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/folders.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bookmarks.js') }}"></script>
</body>

</html>
