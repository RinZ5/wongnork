<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folders.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="/">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>
            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>
            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
                <a href="/folders" class="btn btn-secondary" style="display:none;" id="navFoldersBtn">Folders</a>
                <button id="navLogoutBtn" class="btn btn-primary" style="display:none;">Logout</button>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div id="bookmarkModal" class="modal-overlay" style="display: none;">
        <div class="modal-box modal-small">
            <button class="modal-close" onclick="closeBookmarkModal()">✕</button>
            <h2 class="modal-title">Save "<span id="bmRecipeName"></span>"</h2>
            <form id="bookmarkForm" class="auth-form">
                <input type="hidden" id="bmRecipeId">
                <div class="form-group">
                    <label for="bmFolderSelect">Select Folder</label>
                    <select id="bmFolderSelect" required></select>
                </div>
                <div class="form-group">
                    <label for="bmRating">Your Rating (1-5)</label>
                    <input type="number" id="bmRating" min="1" max="5" value="5" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Save Bookmark</button>
            </form>
            <div id="bmMessage" style="margin-top: 10px; text-align: center; font-weight: 500;"></div>
        </div>
    </div>

    <div id="recipeModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="modalImg" class="modal-hero-img" src="" alt="">
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 id="modalTitle" class="modal-title" style="margin: 0;"></h2>
                    <button id="modalBookmarkBtn" class="btn btn-primary" style="padding: 8px 15px;">⭐ Save
                        Recipe</button>
                </div>
                <div class="modal-cols">
                    <div>
                        <div class="col-label">Ingredients</div>
                        <ul id="modalIngredients"></ul>
                    </div>
                    <div>
                        <div class="col-label">Instructions</div>
                        <ol id="modalInstructions"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bookmarks.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
