<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork — Recipe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recipe.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folders.css') }}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="/">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>

            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>

            <form class="header-search" action="/search" method="get">
                <input name="q" type="text" placeholder="Search recipes, ingredients...">
                <button type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </button>
            </form>

            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main>
        <div id="spinner" class="spinner"><span class="spinner-ring"></span></div>

        <div id="errorSection" class="error-section" style="display: none;">
            <div class="error-icon">📖</div>
            <h2>Recipe Not Found</h2>
            <p>Sorry, we couldn't find that recipe. Try searching for something else.</p>
            <a href="/search" class="btn btn-primary">Search Recipes</a>
        </div>

        <article id="recipeContent" class="recipe-page" style="display: none;">
            <button class="back-button" onclick="window.history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </button>
            <div class="recipe-hero">
                <img id="recipeImage" src="" alt="" class="recipe-hero-img">
            </div>

            <div class="recipe-container">
                <div class="recipe-header">
                    <h1 id="recipeTitle" class="recipe-page-title"></h1>
                    <div id="bookmarkSection" class="bookmark-section">
                        <button id="bookmarkButton" class="bookmark-btn recipe-bookmark-btn" onclick="handleBookmarkClick()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </button>
                        <div id="bookmarkStatus" class="bookmark-status"></div>
                    </div>
                </div>

                <div class="recipe-columns">
                    <section class="recipe-section">
                        <h2 class="section-title">Ingredients</h2>
                        <ul id="ingredientsList"></ul>
                    </section>

                    <section class="recipe-section">
                        <h2 class="section-title">Instructions</h2>
                        <ol id="instructionsList"></ol>
                    </section>
                </div>
            </div>
        </article>
    </main>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script>
        const recipeId = {{ recipe_id }};
    </script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/folders.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recipe.js') }}"></script>
</body>

</html>
