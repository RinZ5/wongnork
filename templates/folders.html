<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork — My Folders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folders.css') }}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="/">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>

            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>

            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main>
        <div class="folders-page">
            <div class="folders-header">
                <h1 class="page-title">My Folders</h1>
                <button id="createFolderBtn" class="btn btn-primary">Create Folder</button>
            </div>

            <div id="foldersList" class="folders-list">
                <div class="spinner"><span class="spinner-ring"></span></div>
            </div>

            <div id="noFolders" class="no-folders" style="display: none;">
                <div class="no-folders-icon">📁</div>
                <h3>No folders yet</h3>
                <p>Create a folder to start saving your favorite recipes</p>
                <button class="btn btn-primary" onclick="document.getElementById('createFolderBtn').click()">Create Your First Folder</button>
            </div>
        </div>
    </main>

    <div id="createFolderModal" class="modal-overlay">
        <div class="modal-box modal-small">
            <button class="modal-close" onclick="closeCreateFolderModal()">✕</button>
            <h2 class="modal-title">Create New Folder</h2>
            <form id="createFolderForm" class="auth-form">
                <div class="form-group">
                    <label for="folderName">Folder Name</label>
                    <input type="text" id="folderName" name="folderName" placeholder="e.g., Favorites, Dinner Ideas" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Create Folder</span>
                    <span class="btn-spinner" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.3" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round">
                                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite" />
                            </path>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/folders.js') }}"></script>
</body>

</html>
