<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WongNork — Save Recipe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folders.css') }}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="/">
                <div class="brand-bubble">W</div>
                <span class="brand-text">WongNork</span>
            </a>

            <div class="brand-cooking">
                <span class="cooking-icon">🍳</span>
                <span class="cooking-label">Cooking</span>
            </div>

            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <main>
        <div class="create-folder-page">
            <button class="back-button" id="backButton">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Recipe
            </button>

            <div class="form-container">
                <div class="form-header">
                    <div class="form-icon">📚</div>
                    <h1 class="form-title">Save Recipe</h1>
                    <p class="form-subtitle">Choose a folder and rating</p>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <form id="bookmarkForm" class="auth-form">
                    <div class="form-group">
                        <label for="folderSelect">Folder</label>
                        <select id="folderSelect" name="folder" required>
                            <option value="">Loading folders...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ratingSelect">Rating</label>
                        <select id="ratingSelect" name="rating">
                            <option value="0" selected>No rating</option>
                            <option value="1">1 star</option>
                            <option value="2">2 stars</option>
                            <option value="3">3 stars</option>
                            <option value="4">4 stars</option>
                            <option value="5">5 stars</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <span class="btn-text">Save Recipe</span>
                        <span class="btn-spinner" style="display: none;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.3" />
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round">
                                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite" />
                                </path>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const recipeId = {{ recipe_id }};
    </script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bookmark-page.js') }}"></script>
</body>

</html>
